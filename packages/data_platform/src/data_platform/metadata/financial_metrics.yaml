version: 1
metrics:
  - metric_id: "gross_transaction_volume"
    metric_name: "Gross Transaction Volume"
    business_definition: "Total commercial payments and transfer principal amount initiated before applying transaction reversals or cancellations."
    formula: "SUM(transaction_amount_eur)"
    source_model: "fct_transactions"
    relevant_columns:
      - "transaction_amount"
      - "transaction_amount_eur"
      - "transaction_currency"
      - "transaction_status"
      - "transaction_date"
    grain: "One row per transaction_id"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Multi-currency native amounts must not be summed directly; must be grouped by transaction_currency."
    reporting_currency_conversion: "Converted to EUR using the ECB daily mid-rate on transaction_date."
    date_field: "transaction_date"
    applicable_filters: "None (includes all statuses: SETTLED, PENDING, REVERSED, FAILED)."
    data_quality_requirements: "transaction_amount > 0, transaction_currency NOT NULL, reporting_eur_fx_rate > 0."
    classification: "CONFIDENTIAL"
    example_business_questions:
      - "What was the total transaction volume processed in November 2026?"
      - "What is the monthly gross volume by transaction rail?"
    known_limitations: "Includes reversed and failed transactions; use net_transaction_volume for executed economic turnover."

  - metric_id: "net_transaction_volume"
    metric_name: "Net Transaction Volume"
    business_definition: "Total principal volume of settled and pending commercial transactions excluding reversed and failed movements."
    formula: "SUM(CASE WHEN transaction_status NOT IN ('REVERSED', 'FAILED') THEN transaction_amount_eur ELSE 0 END)"
    source_model: "fct_transactions"
    relevant_columns:
      - "transaction_amount_eur"
      - "transaction_status"
      - "transaction_date"
    grain: "One row per transaction_id"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Summable only when grouped by transaction_currency."
    reporting_currency_conversion: "Standard ECB daily mid-rate conversion to EUR."
    date_field: "transaction_date"
    applicable_filters: "transaction_status NOT IN ('REVERSED', 'FAILED')"
    data_quality_requirements: "transaction_status in ('SETTLED', 'PENDING')"
    classification: "CONFIDENTIAL"
    example_business_questions:
      - "What is the net payment volume after deducting customer reversals?"
      - "Which customer segment generates the largest net transaction throughput?"
    known_limitations: "Pending transactions may subsequently fail or reverse prior to clearing."

  - metric_id: "reversal_rate"
    metric_name: "Transaction Reversal Rate"
    business_definition: "The proportion of initiated transactions that were reversed due to disputes, errors, or cancellation."
    formula: "COUNT(*) FILTER (WHERE transaction_status = 'REVERSED')::float / NULLIF(COUNT(*), 0)"
    source_model: "fct_transactions"
    relevant_columns:
      - "transaction_id"
      - "transaction_status"
      - "transaction_date"
    grain: "One row per transaction_id"
    aggregation_behavior: "RATIO"
    native_currency_treatment: "Currency-agnostic count ratio."
    reporting_currency_conversion: "Not applicable (unitless ratio)."
    date_field: "transaction_date"
    applicable_filters: "None"
    data_quality_requirements: "Total transaction count must be non-zero."
    classification: "INTERNAL"
    example_business_questions:
      - "What is our overall payment reversal percentage across channels?"
      - "Are CARD_SETTLEMENT transactions experiencing higher reversal rates than WIRE_TRANSFER?"
    known_limitations: "Transactions reversed in subsequent months are attributed to their initiation transaction_date."

  - metric_id: "assessed_fees"
    metric_name: "Gross Assessed Fees"
    business_definition: "Gross contractual fee revenue calculated and assessed on transactions prior to discretionary waivers."
    formula: "SUM(gross_assessed_amount)"
    source_model: "fct_fee_assessments"
    relevant_columns:
      - "gross_assessed_amount"
      - "currency"
      - "assessed_date"
      - "fee_type"
    grain: "One row per assessment_id"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Must be partitioned by fee assessment currency."
    reporting_currency_conversion: "Daily ECB mid-rate to EUR on assessed_date."
    date_field: "assessed_date"
    applicable_filters: "None"
    data_quality_requirements: "gross_assessed_amount >= 0."
    classification: "INTERNAL"
    example_business_questions:
      - "What was the total contractual fee value assessed in Q4?"
      - "Which fee schedule component generates the most gross fee potential?"
    known_limitations: "Does not reflect actual cash realization or customer waivers."

  - metric_id: "waived_fees"
    metric_name: "Waived Fees"
    business_definition: "Total monetary value of contractual transaction fees explicitly waived by relationship managers or commercial promotions."
    formula: "SUM(waived_amount)"
    source_model: "fct_fee_assessments"
    relevant_columns:
      - "waived_amount"
      - "currency"
      - "waiver_reason"
      - "assessed_date"
    grain: "One row per assessment_id"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Summable only when filtered by currency."
    reporting_currency_conversion: "Converted to EUR via ECB mid-rate."
    date_field: "assessed_date"
    applicable_filters: "waived_amount > 0"
    data_quality_requirements: "waived_amount <= gross_assessed_amount."
    classification: "INTERNAL"
    example_business_questions:
      - "How much fee concession was granted to INSTITUTIONAL clients this month?"
      - "What is the primary driver of commercial fee waivers?"
    known_limitations: "Waivers are granted at transaction assessment time; does not capture retrospective goodwill credits."

  - metric_id: "collected_fees"
    metric_name: "Collected Fees"
    business_definition: "Total monetary value of fees successfully settled and swept from customer accounts into bank revenue accounts."
    formula: "SUM(collected_amount)"
    source_model: "fct_fee_assessments"
    relevant_columns:
      - "collected_amount"
      - "currency"
      - "assessed_date"
    grain: "One row per assessment_id"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Group by currency before aggregation."
    reporting_currency_conversion: "Converted to EUR using ECB mid-rate."
    date_field: "assessed_date"
    applicable_filters: "collected_amount > 0"
    data_quality_requirements: "collected_amount <= net_collectible_amount."
    classification: "INTERNAL"
    example_business_questions:
      - "How much fee revenue was actually collected in cash during November?"
      - "What is total fee realization across European currencies?"
    known_limitations: "Collections may lag fee assessment dates by several days."

  - metric_id: "fee_collection_rate"
    metric_name: "Fee Collection Realization Rate"
    business_definition: "Percentage of net collectible fees successfully collected from customer accounts into bank cash accounts."
    formula: "SUM(collected_amount_eur) / NULLIF(SUM(net_collectible_amount_eur), 0)"
    source_model: "fct_fee_assessments"
    relevant_columns:
      - "collected_amount_eur"
      - "net_collectible_amount_eur"
      - "currency"
      - "assessed_date"
    grain: "One row per assessment_id"
    aggregation_behavior: "RATIO"
    native_currency_treatment: "Ratio can be evaluated per currency or globally in normalized EUR reporting amounts."
    reporting_currency_conversion: "Unitless percentage based on daily ECB mid-rate converted amounts."
    date_field: "assessed_date"
    applicable_filters: "net_collectible_amount_eur > 0"
    data_quality_requirements: "net_collectible_amount_eur > 0, collected_amount_eur >= 0."
    classification: "INTERNAL"
    example_business_questions:
      - "What percentage of collectible fees are we successfully collecting?"
      - "Which customer segments suffer from poor fee collection rates?"
    known_limitations: "Overdraft restrictions or insufficient account balances will depress this rate; lags may occur during multi-day sweep retries."

  - metric_id: "recognized_revenue"
    metric_name: "Recognized Revenue"
    business_definition: "Governed earned banking fee revenue recognized under accrual principles, linked to GL credit postings."
    formula: "SUM(net_recognized_revenue_eur)"
    source_model: "fct_customer_revenue"
    relevant_columns:
      - "gross_assessed_fee_amount_eur"
      - "waived_fee_amount_eur"
      - "net_collectible_fee_amount_eur"
      - "collected_fee_amount_eur"
      - "outstanding_fee_amount_eur"
      - "pass_through_cost_amount_eur"
      - "net_recognized_revenue_eur"
      - "currency"
      - "reporting_month"
    grain: "One row per (customer_id, reporting_month, currency, revenue_category)"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Native amounts separated in net_recognized_revenue; reporting amount unified in net_recognized_revenue_eur."
    reporting_currency_conversion: "Pre-converted at month-end / daily accounting mid-rates in EUR."
    date_field: "reporting_month"
    applicable_filters: "None"
    data_quality_requirements: "Reconciled with General Ledger revenue accounts (GL 4000 series)."
    classification: "CONFIDENTIAL"
    example_business_questions:
      - "What was the recognized financial revenue for the current financial year?"
      - "Which product line delivers the highest recognized revenue margin?"
    known_limitations: "Revenue recognition requires settled fee collection; uncollected fees are held in arrears."

  - metric_id: "net_customer_profitability"
    metric_name: "Net Customer Fee Contribution Margin"
    business_definition: "Net fee revenue earned from a commercial relationship after deducting granted waivers, concessions, reversals, and pass-through network costs."
    formula: "SUM(net_recognized_revenue_eur)"
    source_model: "fct_customer_revenue"
    relevant_columns:
      - "customer_id"
      - "net_recognized_revenue_eur"
      - "waived_fee_amount_eur"
      - "pass_through_cost_amount_eur"
      - "reporting_month"
    grain: "One row per (customer_id, reporting_month, currency, revenue_category)"
    aggregation_behavior: "SUM"
    native_currency_treatment: "Expressed in EUR reporting currency."
    reporting_currency_conversion: "Standard EUR conversion via daily ECB mid-rates."
    date_field: "reporting_month"
    applicable_filters: "None"
    data_quality_requirements: "Customer must exist in dim_customers."
    classification: "CONFIDENTIAL"
    example_business_questions:
      - "Who are the top 10 most profitable commercial clients this quarter by fee contribution?"
      - "Are any enterprise relationships operating at net negative profitability after fee waivers?"
    known_limitations: "Reflects direct fee contribution margin (Contribution Margin I); does not allocate unassigned branch/platform operating overhead or credit risk provisions."

  - metric_id: "average_customer_daily_balance"
    metric_name: "Average Customer Ledger Balance"
    business_definition: "Average closing ledger balance across a customer's operating and treasury accounts."
    formula: "AVG(closing_ledger_balance)"
    source_model: "dim_accounts"
    relevant_columns:
      - "closing_ledger_balance"
      - "account_currency"
      - "customer_id"
      - "opened_date"
    grain: "One row per account_id"
    aggregation_behavior: "AVG"
    native_currency_treatment: "Averaged within account_currency."
    reporting_currency_conversion: "ECB mid-rate conversion applied to closing balance."
    date_field: "opened_date"
    applicable_filters: "account_status = 'OPEN'"
    data_quality_requirements: "closing_ledger_balance must match GL customer liability subledger."
    classification: "CONFIDENTIAL"
    example_business_questions:
      - "What is the average operating balance maintained by Commercial SME clients?"
      - "Which accounts hold balances below their required minimum threshold?"
    known_limitations: "Snapshot metric reflecting current subledger position rather than daily time-weighted balance."

  - metric_id: "billing_exception_rate"
    metric_name: "Billing Exception & Arrears Rate"
    business_definition: "Proportion of fee assessments that resulted in uncollected arrears or collection failures."
    formula: "COUNT(*) FILTER (WHERE outstanding_amount > 0)::float / NULLIF(COUNT(*), 0)"
    source_model: "fct_fee_assessments"
    relevant_columns:
      - "assessment_id"
      - "outstanding_amount"
      - "outstanding_amount_eur"
      - "customer_id"
      - "customer_name"
      - "currency"
      - "collection_status"
      - "assessed_date"
    grain: "One row per assessment_id"
    aggregation_behavior: "RATIO"
    native_currency_treatment: "Unitless count ratio."
    reporting_currency_conversion: "Not applicable."
    date_field: "assessed_date"
    applicable_filters: "None"
    data_quality_requirements: "outstanding_amount >= 0."
    classification: "INTERNAL"
    example_business_questions:
      - "What percentage of fee assessments encounter billing or collection exceptions?"
      - "Is the billing exception rate improving month-over-month?"
    known_limitations: "Includes transient arrears pending secondary collection sweeps."

  - metric_id: "effective_take_rate"
    metric_name: "Effective Fee Realization Rate"
    business_definition: "Net fee revenue earned as a percentage of gross assessed fees after deducting waivers and uncollected arrears."
    formula: "SUM(net_recognized_revenue_eur) / NULLIF(SUM(gross_assessed_fee_amount_eur), 0)"
    source_model: "fct_customer_revenue"
    relevant_columns:
      - "net_recognized_revenue_eur"
      - "gross_assessed_fee_amount_eur"
      - "currency"
      - "reporting_month"
    grain: "One row per (customer_id, reporting_month, currency, revenue_category)"
    aggregation_behavior: "RATIO"
    native_currency_treatment: "Evaluated on normalized EUR amounts across all currencies or grouped by currency."
    reporting_currency_conversion: "Unitless percentage based on EUR-converted amounts."
    date_field: "reporting_month"
    applicable_filters: "gross_assessed_fee_amount_eur > 0"
    data_quality_requirements: "gross_assessed_fee_amount_eur > 0."
    classification: "INTERNAL"
    example_business_questions:
      - "What proportion of our gross assessed fees translates into net recognized banking revenue?"
      - "How do fee concessions erode our headline fee realization rate across client tiers?"
    known_limitations: "Measures realization on fee potential; for fee revenue relative to commercial payment throughput volume, divide by fct_transactions volume."
